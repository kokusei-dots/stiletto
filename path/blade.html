<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stiletto blade — path viewer (relative)</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #1a1a1c;
            --fg: #e6e6e6;
            --muted: #9a9a9a;
            --line: #3a3a3d;
            --panel: #242427;
            --field: #2c2c30;
            --canvas: #1e1e20;
            --accent: #e0457b;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font: 15px system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 18px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
        }

        header h1 {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
        }

        .readout {
            font-variant-numeric: tabular-nums;
            color: var(--muted);
        }

        .readout b {
            color: var(--fg);
            font-weight: 600;
        }

        .readout code {
            background: var(--field);
            border-radius: 3px;
            padding: 1px 5px;
        }

        .stage {
            flex: 1;
            min-height: 0;
            display: flex;
            padding: 16px;
        }

        svg {
            width: 100%;
            height: 100%;
            background: var(--canvas);
            border: 1px solid var(--line);
        }

        .path {
            fill: rgba(224, 69, 123, .05);
            stroke: #5a5a5e;
        }

        .hi {
            fill: none;
            stroke: #ff7fb0;
            stroke-linecap: round;
        }

        .guide {
            stroke: #6a6a6e;
            stroke-dasharray: 4 4;
            fill: none;
        }

        .anchor {
            fill: #cfcfcf;
        }

        .handle {
            fill: var(--accent);
        }

        footer {
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        input[type=range] {
            flex: 1;
            accent-color: var(--accent);
            height: 28px;
        }

        footer .pct {
            font-variant-numeric: tabular-nums;
            min-width: 7ch;
            text-align: right;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <header>
        <h1>Stiletto blade — path viewer (relative)</h1>
        <span class="readout" id="readout"></span>
    </header>

    <div class="stage">
        <svg id="stage" viewBox="0 0 1749.84 1996.14" preserveAspectRatio="xMidYMid meet">
            <path id="blade" class="path" />
            <path id="hi" class="hi" />
            <g id="marks"></g>
        </svg>
    </div>

    <footer>
        <input type="range" id="slider" min="1" max="1" value="1" step="1" aria-label="curve index">
        <span class="pct" id="pct">1 / 1</span>
    </footer>

    <script>
        // path data: components/stiletto-blade/fix-relative.svg  (M + relative c + z)
        const D = `M506.47,907.46
      c3.6,-0.31,10.37,19.91,11.53,23.26 c0.93,2.68,1.9,5.34,2.9,7.99
      c12.31,32.69,30.13,63.5,54.35,88.83 c21.72,22.72,48.62,41.6,76.72,55.66
      c14.42,7.22,29.03,13.58,42.43,22.71 c14.25,9.71,27.15,21.33,38.49,34.3
      c32.98,37.72,98.12,143.32,115.81,187.23 c16.58,41.16,22.15,84.24,24.28,128.23
      c0.16,3.3,0.3,6.61,0.44,9.91 c0.1,2.65,0.2,5.29,0.29,7.93
      c0.08,1.99,0.14,3.97,0.21,5.96 c0.09,3.02,-0.74,17.48,3.95,19.45
      c8.49,3.57,6.64,-9.47,6.61,-13.27 c-0.11,-17.03,0.64,-34.06,2.07,-51.02
      c4.08,-48.26,10.65,-86.41,31.34,-130.42 c27.75,-59.04,63.36,-119.86,106.95,-168.72
      c11.34,-12.97,24.24,-24.59,38.49,-34.3 c13.4,-9.13,28.01,-15.49,42.43,-22.71
      c28.1,-14.06,55,-32.94,76.72,-55.66 c24.22,-25.33,42.04,-56.14,54.35,-88.83
      c1,-2.65,1.97,-5.31,2.9,-7.99 c1.16,-3.35,7.93,-23.57,11.53,-23.26
      c3.21,0.44,4.82,21.41,5.11,24.18 c2.83,27.71,-4.04,54.57,-13.63,80.41
      c-5.78,15.58,-13.22,30.56,-20.55,45.46 c-19.89,40.44,-42.73,79.23,-64.51,118.66
      c-5.94,10.76,-40.65,52.14,-64.04,91.56
      c-7.33,12.36,-14,25.01,-21,37.54 c-1.1,1.97,-2.12,4.34,-3.54,6.09
      c-0.73,0.9,-1.96,1.08,-2.61,2.27 c-0.69,1.27,-0.75,2.64,-1.06,4.02
      c-0.75,3.38,-3.34,7.09,-4.94,10.11 c-0.65,1.22,-1.83,1.97,-2.5,3.04
      c-7.28,11.69,-12.68,25.29,-18.38,37.78 c-16.85,36.91,-30.71,74.59,-44.31,112.78
      c-24.84,69.82,-46.36,140.9,-65.19,212.57 c-7.52,28.66,-12.81,57.44,-18.51,86.45
      c-10.8,54.95,-18.64,110.82,-33.73,164.75 c-15.09,-53.93,-22.93,-109.8,-33.73,-164.75
      c-21.21,-107.94,-67.78,-241.75,-103.21,-324.48 c-4.17,-9.74,-7.99,-19.64,-12.49,-29.24
      c-11.08,-23.65,-23.27,-46.82,-35,-70.14 c-3.17,-6.29,-5.56,-13.03,-8.77,-19.34
      c-8.56,-16.8,-17.88,-33.25,-26.8,-49.85 c-19.1,-35.56,-38.3,-71.07,-57.82,-106.41
      c-21.78,-39.43,-44.62,-78.22,-64.51,-118.66 c-7.33,-14.9,-14.77,-29.88,-20.55,-45.46
      c-9.59,-25.84,-16.46,-52.7,-13.63,-80.41 c0.29,-2.77,1.9,-23.74,5.11,-24.18 z`;

        const NS = 'http://www.w3.org/2000/svg';
        const $ = id => document.getElementById(id);
        const svg = $('stage'), path = $('blade'), hi = $('hi'), marks = $('marks');
        const slider = $('slider'), pct = $('pct'), readout = $('readout');

        path.setAttribute('d', D);

        // parse M/m, C/c, L/l, Z/z into absolute cubic segments
        const tok = D.match(/[a-zA-Z]|-?\d*\.?\d+(?:e-?\d+)?/g) || [];
        let i = 0, cmd = null, start = { x: 0, y: 0 }, cur = start;
        const segs = [];  // { c1x,c1y,c2x,c2y,x,y,from } — all absolute
        const take = n => tok.slice(i, i += n).map(parseFloat);
        while (i < tok.length) {
            if (/[a-zA-Z]/.test(tok[i])) {
                cmd = tok[i++];
                if (/[zZ]/.test(cmd)) { cur = start; cmd = null; }
                continue;
            }
            const rel = cmd === cmd.toLowerCase();
            const bx = rel ? cur.x : 0, by = rel ? cur.y : 0;
            if (cmd === 'M' || cmd === 'm') {
                const [x, y] = take(2);
                start = cur = { x: x + bx, y: y + by };
                cmd = rel ? 'l' : 'L';           // subsequent pairs are implicit lineto
            } else if (cmd === 'C' || cmd === 'c') {
                const [c1x, c1y, c2x, c2y, x, y] = take(6);
                segs.push({
                    c1x: c1x + bx, c1y: c1y + by,
                    c2x: c2x + bx, c2y: c2y + by,
                    x: x + bx, y: y + by, from: cur
                });
                cur = { x: x + bx, y: y + by };
            } else if (cmd === 'L' || cmd === 'l') {
                const [x, y] = take(2);
                cur = { x: x + bx, y: y + by };
            } else { i++; }
        }

        const N = segs.length;
        const vb = svg.viewBox.baseVal;
        const U = Math.max(vb.width, vb.height) / 450;
        path.setAttribute('stroke-width', U);
        hi.setAttribute('stroke-width', U * 2.6);

        slider.max = N;
        slider.value = 1;

        const mk = (tag, attrs) => {
            const e = document.createElementNS(NS, tag);
            for (const k in attrs) e.setAttribute(k, attrs[k]);
            return e;
        };
        const n1 = v => (Math.round(v * 100) / 100);

        function update() {
            const k = Math.min(N, Math.max(1, +slider.value));
            const s = segs[k - 1], p = s.from;

            hi.setAttribute('d',
                `M ${p.x},${p.y} C ${s.c1x},${s.c1y} ${s.c2x},${s.c2y} ${s.x},${s.y}`);

            marks.replaceChildren(
                mk('line', { class: 'guide', 'stroke-width': U * .6, x1: p.x, y1: p.y, x2: s.c1x, y2: s.c1y }),
                mk('line', { class: 'guide', 'stroke-width': U * .6, x1: s.x, y1: s.y, x2: s.c2x, y2: s.c2y }),
                mk('circle', { class: 'handle', r: U * 1.7, cx: s.c1x, cy: s.c1y }),
                mk('circle', { class: 'handle', r: U * 1.7, cx: s.c2x, cy: s.c2y }),
                mk('rect', { class: 'anchor', x: p.x - U * 2, y: p.y - U * 2, width: U * 4, height: U * 4 }),
                mk('rect', { class: 'anchor', x: s.x - U * 2, y: s.y - U * 2, width: U * 4, height: U * 4 }),
            );

            pct.textContent = `${k} / ${N}`;
            readout.innerHTML =
                `curve <b>${k}</b> / ${N}` +
                ` &nbsp;·&nbsp; <b>${n1(p.x)},${n1(p.y)}</b> → <b>${n1(s.x)},${n1(s.y)}</b>` +
                ` &nbsp;·&nbsp; <code>C ${n1(s.c1x)},${n1(s.c1y)} ${n1(s.c2x)},${n1(s.c2y)} ${n1(s.x)},${n1(s.y)}</code>`;
        }

        slider.addEventListener('input', update);
        addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();   // else a focused range input also steps: +1 native +1 here = skips odd
                slider.value = +slider.value + (e.key === 'ArrowRight' ? 1 : -1);
                update();
            }
        });
        update();
    </script>
</body>

</html>

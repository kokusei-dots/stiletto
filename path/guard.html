<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stiletto guard — path viewer (relative)</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #1a1a1c;
            --fg: #e6e6e6;
            --muted: #9a9a9a;
            --line: #3a3a3d;
            --panel: #242427;
            --field: #2c2c30;
            --canvas: #1e1e20;
            --accent: #e0457b;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font: 15px system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 18px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
        }

        header h1 {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
        }

        .readout {
            font-variant-numeric: tabular-nums;
            color: var(--muted);
        }

        .readout b {
            color: var(--fg);
            font-weight: 600;
        }

        .readout code {
            background: var(--field);
            border-radius: 3px;
            padding: 1px 5px;
        }

        .stage {
            flex: 1;
            min-height: 0;
            display: flex;
            padding: 16px;
        }

        svg {
            width: 100%;
            height: 100%;
            background: var(--canvas);
            border: 1px solid var(--line);
        }

        .path {
            fill: rgba(224, 69, 123, .05);
            stroke: #5a5a5e;
        }

        .hi {
            fill: none;
            stroke: #ff7fb0;
            stroke-linecap: round;
        }

        .guide {
            stroke: #6a6a6e;
            stroke-dasharray: 4 4;
            fill: none;
        }

        .anchor {
            fill: #cfcfcf;
        }

        .handle {
            fill: var(--accent);
        }

        footer {
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        input[type=range] {
            flex: 1;
            accent-color: var(--accent);
            height: 28px;
        }

        footer .pct {
            font-variant-numeric: tabular-nums;
            min-width: 7ch;
            text-align: right;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <header>
        <h1>Stiletto guard — path viewer (relative)</h1>
        <span class="readout" id="readout"></span>
    </header>

    <div class="stage">
        <svg id="stage" viewBox="0 0 1749.84 1996.14" preserveAspectRatio="xMidYMid meet">
            <path id="guard" class="path" />
            <path id="hi" class="hi" />
            <g id="marks"></g>
        </svg>
    </div>

    <footer>
        <input type="range" id="slider" min="1" max="1" value="1" step="1" aria-label="curve index">
        <span class="pct" id="pct">1 / 1</span>
    </footer>

    <script>
        // path data: components/guard/fix-relative.svg  (M + relative c/l + z)
        // rotated so M is the left peak (456.29,568.27); shape identical to extend.svg
        const D = `M456.29,568.27
      c2.23,-.39,2.32,2.09,2.81,3.7 c.69,2.23,1.11,4.57,2.02,6.7
      c18.25,37.38,38.2,73.74,63.04,107.88 c18.04,25.96,36.98,51.11,60,72.92
      c75.18,71.53,218.66,198.97,231.77,206.24 c5.7,3.16,11.93,2.75,18.13,2.68
      c1.83,-.02,4.35,-.59,4.78,1.98 c.35,2.09,-1.97,2.73,-3.47,3.31
      c-6.85,2.67,-10.02,9.42,-15.48,13.73 c-12.27,9.67,-23.83,20.23,-35.58,30.55
      c-8.54,7.49,-8.73,10.18,-2.96,19.72 c22.38,37.03,44.71,74.1,66.99,111.2
      c7.95,13.24,15.71,26.61,23.56,39.91 c3.8,5.42,4.45,5.45,8.47,.26
      c1.51,-1.94,2.84,-4.02,4.17,-6.09 l-0.03,0.02
      c6.27,-14.76,14.43,-28.54,21.99,-42.63 c8.02,-14.97,16.26,-29.83,24.34,-44.78
      c9.84,-18.19,19.59,-36.43,29.44,-54.62 c5.07,-9.37,4.68,-11.64,-3.15,-19.01
      c-17.74,-16.7,-35.43,-33.46,-53.12,-50.22 c-1.26,-1.19,-2.56,-2.42,-3.54,-3.83
      c-1.64,-2.36,-1.02,-4.06,1.96,-4.44 c5.94,-.76,11.88,-1.55,17.85,-2.09
      c14.94,-1.35,160.87,-129.72,236.05,-200.47 c22.92,-21.57,41.86,-46.44,59.9,-72.12
      c24.14,-34.36,42.25,-71.87,58.86,-110.21 c.91,-2.11,1.33,-4.42,2.02,-6.63
      c.49,-1.59,.58,-4.05,2.81,-3.66 c2.06,.36,1.67,2.73,1.7,4.42
      c.04,2.9,.01,5.8,.01,8.7 c1.32,15.41,1.93,30.83,1.31,46.34
      c-1,24.58,-6.26,48.27,-14.58,71.27 c-18.08,49.99,-42.49,96.91,-70.57,141.92
      c-15.94,25.56,-32.1,51.01,-49.97,75.31 c-2.73,3.71,-4.76,7.92,-7.37,11.77
      c-29.78,43.93,-64.61,84.37,-100.45,123.51 c-28.2,30.79,-56.52,61.48,-81.87,94.71
      c-20.47,26.84,-37.31,55.74,-49.58,87.35 c-7.3,18.79,-13.24,38,-18.3,57.4
      c-2.8,10.73,-6.97,21.33,-7.3,32.7 c-.05,1.72,-.07,4.33,-2.79,4.33
      c-2.27,0,-3.26,-2.04,-3.72,-3.92 c-2.21,-9.01,-4.29,-18.04,-6.38,-27.08
      c-3.63,-15.73,-10.39,-30.31,-16.5,-45.14 c-18.49,-44.93,-44.23,-85.87,-70.1,-126.67
      c-15.61,-24.62,-33.03,-48.03,-51.13,-70.94 c-24.8,-31.4,-50.79,-61.8,-76.64,-92.32
      c-16.73,-19.75,-33.61,-39.39,-49.92,-59.48 c-17.53,-21.59,-35.37,-42.95,-51.58,-65.6
      c-9.79,-13.68,-19.35,-27.5,-28.08,-41.88 c-1.49,-2.46,-2.64,-5.13,-3.94,-7.71
      c-11.76,-18.64,-20.52,-38.68,-27.88,-59.38 l.03,.04
      c-18.33,-51.54,-40.8,-105.01,-38.03,-159.65
      z`;

        const NS = 'http://www.w3.org/2000/svg';
        const $ = id => document.getElementById(id);
        const svg = $('stage'), path = $('guard'), hi = $('hi'), marks = $('marks');
        const slider = $('slider'), pct = $('pct'), readout = $('readout');

        path.setAttribute('d', D);

        // parse M/m, C/c, L/l, Z/z into absolute cubic segments
        const tok = D.match(/[a-zA-Z]|-?\d*\.?\d+(?:e-?\d+)?/g) || [];
        let i = 0, cmd = null, start = { x: 0, y: 0 }, cur = start;
        const segs = [];  // { c1x,c1y,c2x,c2y,x,y,from } — all absolute
        const take = n => tok.slice(i, i += n).map(parseFloat);
        while (i < tok.length) {
            if (/[a-zA-Z]/.test(tok[i])) {
                cmd = tok[i++];
                if (/[zZ]/.test(cmd)) { cur = start; cmd = null; }
                continue;
            }
            const rel = cmd === cmd.toLowerCase();
            const bx = rel ? cur.x : 0, by = rel ? cur.y : 0;
            if (cmd === 'M' || cmd === 'm') {
                const [x, y] = take(2);
                start = cur = { x: x + bx, y: y + by };
                cmd = rel ? 'l' : 'L';           // subsequent pairs are implicit lineto
            } else if (cmd === 'C' || cmd === 'c') {
                const [c1x, c1y, c2x, c2y, x, y] = take(6);
                segs.push({
                    c1x: c1x + bx, c1y: c1y + by,
                    c2x: c2x + bx, c2y: c2y + by,
                    x: x + bx, y: y + by, from: cur
                });
                cur = { x: x + bx, y: y + by };
            } else if (cmd === 'L' || cmd === 'l') {
                const [x, y] = take(2);
                cur = { x: x + bx, y: y + by };
            } else { i++; }
        }

        const N = segs.length;
        const vb = svg.viewBox.baseVal;
        const U = Math.max(vb.width, vb.height) / 450;
        path.setAttribute('stroke-width', U);
        hi.setAttribute('stroke-width', U * 2.6);

        slider.max = N;
        slider.value = 1;

        const mk = (tag, attrs) => {
            const e = document.createElementNS(NS, tag);
            for (const k in attrs) e.setAttribute(k, attrs[k]);
            return e;
        };
        const n1 = v => (Math.round(v * 100) / 100);

        function update() {
            const k = Math.min(N, Math.max(1, +slider.value));
            const s = segs[k - 1], p = s.from;

            hi.setAttribute('d',
                `M ${p.x},${p.y} C ${s.c1x},${s.c1y} ${s.c2x},${s.c2y} ${s.x},${s.y}`);

            marks.replaceChildren(
                mk('line', { class: 'guide', 'stroke-width': U * .6, x1: p.x, y1: p.y, x2: s.c1x, y2: s.c1y }),
                mk('line', { class: 'guide', 'stroke-width': U * .6, x1: s.x, y1: s.y, x2: s.c2x, y2: s.c2y }),
                mk('circle', { class: 'handle', r: U * 1.7, cx: s.c1x, cy: s.c1y }),
                mk('circle', { class: 'handle', r: U * 1.7, cx: s.c2x, cy: s.c2y }),
                mk('rect', { class: 'anchor', x: p.x - U * 2, y: p.y - U * 2, width: U * 4, height: U * 4 }),
                mk('rect', { class: 'anchor', x: s.x - U * 2, y: s.y - U * 2, width: U * 4, height: U * 4 }),
            );

            pct.textContent = `${k} / ${N}`;
            readout.innerHTML =
                `curve <b>${k}</b> / ${N}` +
                ` &nbsp;·&nbsp; <b>${n1(p.x)},${n1(p.y)}</b> → <b>${n1(s.x)},${n1(s.y)}</b>` +
                ` &nbsp;·&nbsp; <code>C ${n1(s.c1x)},${n1(s.c1y)} ${n1(s.c2x)},${n1(s.c2y)} ${n1(s.x)},${n1(s.y)}</code>`;
        }

        slider.addEventListener('input', update);
        addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();   // else a focused range input also steps: +1 native +1 here = skips odd
                slider.value = +slider.value + (e.key === 'ArrowRight' ? 1 : -1);
                update();
            }
        });
        update();
    </script>
</body>

</html>
